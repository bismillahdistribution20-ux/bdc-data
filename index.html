<style>
:root{--pri:#7561ff;--pri2:#5f4bea;--bg:#f4f3fb;--card:#fff;--tx:#2b2a3a;--mut:#8a89a0;--line:#e2ddff;--red:#e53935;--grn:#16a34a;--org:#e08a00;--fab:#2b5fc7;--inp:#fff;--sh:0 2px 10px rgba(80,60,200,.10);--chip:#ece9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141f;--card:#201f30;--tx:#eceaff;--mut:#9f9dbb;--line:#3a3762;--inp:#282740;--sh:0 2px 10px rgba(0,0,0,.4);--chip:#2d2b4d;--pri:#7d6bff}}
:root[data-theme="dark"]{--bg:#15141f;--card:#201f30;--tx:#eceaff;--mut:#9f9dbb;--line:#3a3762;--inp:#282740;--sh:0 2px 10px rgba(0,0,0,.4);--chip:#2d2b4d;--pri:#7d6bff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:linear-gradient(to bottom,var(--pri) 0,var(--pri) env(safe-area-inset-top,0px),var(--bg) env(safe-area-inset-top,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Nunito','Hind Siliguri','Noto Sans Bengali','Kalpurush','Siyam Rupali',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}
#shell{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.12)}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#ovl{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;overflow:clip}
.ic{display:block;flex:none}
.hd{background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 8px;flex:none;min-height:60px}
.hd h1{font-size:19px;font-weight:700;margin:0 0 0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hl{width:34px;height:34px;border-radius:50%;background:#fff;flex:none;margin-left:2px}
.ib{background:none;border:0;color:inherit;padding:8px;border-radius:50%;display:grid;place-items:center;position:relative}
.ib:active{background:rgba(127,127,127,.2)}
.dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#e53935;border:2px solid var(--pri)}
.ct{flex:1;overflow-y:auto;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.mt{margin-top:12px}
.bal{background:linear-gradient(140deg,#6b57f2,#8c7cff);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(117,97,255,.35)}
.bal .bt{display:flex;justify-content:space-between;align-items:center;font-weight:600;opacity:.95}
.bal .bamt{font-size:32px;font-weight:800;margin:2px 0 0}
.bal .bsub{display:flex;gap:16px;font-size:13px;opacity:.9;margin-top:2px}
.bal .in{background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;gap:10px}
.bal .in small{display:block;font-size:12px;opacity:.9}.bal .in b{font-size:19px}
.oc{display:flex;align-items:center;justify-content:space-between;border:2px solid;border-radius:18px;padding:16px;background:var(--card);margin-top:12px;cursor:pointer}
.oc small{display:block;color:var(--mut);font-weight:600}.oc b{font-size:22px}
.oc.cb{border-color:#8fb0ea}.oc.co{border-color:#efd39b}.oc.cp{border-color:#b7b0ee}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{background:var(--card);border-radius:14px;padding:10px 2px;text-align:center;font-size:12px;font-weight:700;box-shadow:var(--sh);cursor:pointer}
.qa .ic{margin:0 auto 4px}
h2.st{font-size:16px;margin:20px 2px 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.rm{flex:1;min-width:0}.rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small,.rr small{display:block;color:var(--mut);font-size:12.5px}
.rr{text-align:right;flex:none}.rr b{display:block}
.g{color:var(--grn)!important}.r{color:var(--red)!important}.o{color:var(--org)!important}
.em{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.6}
.fab{position:absolute;right:16px;bottom:18px;background:var(--fab);color:#fff;border:0;border-radius:32px;padding:14px 22px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(43,95,199,.45);z-index:5}
.fg{margin-bottom:12px}
.fg label,.li label{display:block;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--tx);font:inherit;font-size:16px;min-width:0}
.inp:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.inp.sm{padding:9px 10px}
textarea.inp{min-height:110px;resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;width:100%;display:block;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.red{background:var(--red)}
.btn+.btn{margin-top:10px}
.sv{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{display:flex;gap:6px;align-items:center}.pr .inp{flex:1}
.sq{color:var(--pri)}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);font-size:14px}
.tabs .on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sb{position:relative;margin-bottom:12px}.sb .ic{position:absolute;left:12px;top:12px}.sb .inp{padding-left:42px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.li{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.lh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.lt{text-align:right}.lt b{display:block;padding:9px 0}
.sr{display:flex;justify-content:space-between;padding:6px 0;gap:10px}
.sr.big{font-size:18px;font-weight:800;border-top:1.5px dashed var(--line);margin-top:4px;padding-top:10px}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{color:var(--mut);font-weight:700}.tb .n{text-align:right;white-space:nowrap}
.tb tfoot td{font-weight:800}
.receipt{text-align:left}
.receipt h2{margin:0;text-align:center;font-size:20px}.receipt .rc{text-align:center;color:var(--mut);margin-bottom:10px}
.receipt .rlogo{display:block;width:64px;height:64px;margin:0 auto 6px;border-radius:50%}

const SHA_K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256(str){
 const bytes=new TextEncoder().encode(str),l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);
 m.set(bytes);m[l]=0x80;
 const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
 const w=new Uint32Array(64);
 for(let o=0;o<n;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];const s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);const s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
  for(let i=0;i<64;i++){
   const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
   const ch=(e&f)^(~e&g);
   const t1=(h+S1+ch+SHA_K[i]+w[i])>>>0;
   const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
   const mj=(a&b)^(a&c)^(b&c);
   const t2=(S0+mj)>>>0;
   h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
  }
  h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;
 }
 return [h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,'0')).join('');
}
function hashPw(pw,salt){let h=sha256(salt+':'+pw);for(let i=0;i<3000;i++)h=sha256(h+salt+pw);return h}
function mkUser(name,phone,pw){const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);return{name:name,phone:phone,salt:salt,ph:hashPw(pw,salt),upd:Date.now()}}

function flowsOf(t){
 const m=t.mode||'cash';
 switch(t.type){
  case 'sale':case 'purchase_return':return [[m,num(t.paid)]];
  case 'sale_return':case 'purchase':return [[m,-num(t.paid)]];
  case 'pay_in':return [[m,num(t.amount)]];
  case 'pay_out':case 'expense':return [[m,-num(t.amount)]];
  case 'cash_adj':return [['cash',t.dir==='in'?num(t.amount):-num(t.amount)]];
  case 'bank_tx':
   if(t.dir==='transfer')return [[t.from||'cash',-num(t.amount)],[t.to||'cash',num(t.amount)]];
   return t.dir==='deposit'?[['cash',-num(t.amount)],[t.bank,num(t.amount)]]:[['cash',num(t.amount)],[t.bank,-num(t.amount)]];
 }
 return [];
}
function pd(t){
 switch(t.type){
  case 'sale':case 'purchase_return':return num(t.total)-num(t.paid);
  case 'sale_return':case 'purchase':return -(num(t.total)-num(t.paid));
  case 'pay_in':return -num(t.amount);
  case 'pay_out':return num(t.amount);
 }
 return 0;
}
function calc(asOn){
 const c={cash:0,bank:{},party:{},stock:{}};
 db.banks.forEach(b=>c.bank[b.id]=num(b.open));
 db.parties.forEach(p=>c.party[p.id]=(p.oty==='pay'?-1:1)*num(p.open));
 db.products.forEach(p=>c.stock[p.id]=num(p.stock));
 for(const t of db.tx){
  if(asOn&&t.date>asOn)continue;
  for(const f of flowsOf(t)){if(f[0]!=='cash'&&f[0] in c.bank)c.bank[f[0]]+=f[1];else c.cash+=f[1]}
  if(t.party in c.party)c.party[t.party]+=pd(t);
  let sg=0;
  if(t.type==='sale'||t.type==='purchase_return')sg=-1;
  else if(t.type==='sale_return'||t.type==='purchase')sg=1;
  if(sg&&t.items)for(const i of t.items)if(i.pid in c.stock)c.stock[i.pid]+=sg*num(i.qty);
  if(t.type==='stock_adj'&&t.pid in c.stock)c.stock[t.pid]+=(t.dir==='add'?1:-1)*num(t.qty);
 }
 return c;
}
function rng(p){
 const d=new Date(),t=ymd(d);
 if(p==='today')return[t,t];
 if(p==='week'){const s=new Date(d);s.setDate(s.getDate()-6);return[ymd(s),t]}
 if(p==='month')return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
 if(p==='year')return[d.getFullYear()+'-01-01',t];
 return['0000-00-00','9999-12-31'];
}

function metrics(f,t){
 const m={sale:0,sret:0,pur:0,pret:0,cogs:0,exp:0};
 for(const x of db.tx){
  if(x.date<f||x.date>t)continue;
  if(x.type==='sale'){m.sale+=x.total;m.cogs+=cost(x)}
  else if(x.type==='sale_return'){m.sret+=x.total;m.cogs-=cost(x)}
  else if(x.type==='purchase')m.pur+=x.total;
  else if(x.type==='purchase_return')m.pret+=x.total;
  else if(x.type==='expense')m.exp+=num(x.amount);
 }
 m.net=m.sale-m.sret;m.gp=m.net-m.cogs;m.np=m.gp-m.exp;
 return m;
}

function txSearch(x){return(pname(x.party)+' '+(x.no||'')+' '+(x.note||'')+' '+(x.cat?nameOf(db.expCats,x.cat):'')).toLowerCase()}
function txRow(x){
 const d=fd(x.date);
 if(INV[x.type]){
  const I=INV[x.type],due=num(x.total)-num(x.paid);
  const st=I.order?'<small class="'+(x.status==='done'?'g':'o')+'">'+tr(x.status==='done'?'Completed':'Pending')+'</small>':(due>0.004?'<small class="r">'+tr('Due {0}',cur(due))+'</small>':'<small class="g">'+tr('Paid')+'</small>');
  return '<div class="row" data-a="go" data-r="detail" data-id="'+x.id+'"><div class="av">'+esc((pname(x.party)[0]||'W').toUpperCase())+'</div><div class="rm"><b>'+esc(pname(x.party))+'</b><small>'+x.no+' · '+d+'</small></div><div class="rr"><b>'+cur(x.total)+'</b>'+st+'</div></div>';
 }
 let title=ttl(x.type),sub=d,amt='',col='',kind=x.type;
 const acctName=id=>(!id||id==='cash')?tr('Cash'):(nameOf(db.banks,id)||tr('Bank'));
 if(x.type==='pay_in'||x.type==='pay_out'){title=pname(x.party);sub=ttl(x.type)+' · '+d;amt=x.amount;col=x.type==='pay_in'?'g':'r'}
 else if(x.type==='expense'){title=nameOf(db.expCats,x.cat)||tr('Expense');sub=(x.note?x.note+' · ':'')+d;amt=x.amount;col='r'}
 else if(x.type==='cash_adj'){title=tr(x.dir==='in'?'Cash added':'Cash reduced');sub=(x.note?x.note+' · ':'')+d;amt=x.amount;col=x.dir==='in'?'g':'r'}
 else if(x.type==='bank_tx'&&x.dir==='transfer'){kind='transfer';title=acctName(x.from)+' → '+acctName(x.to);sub=tr('Transfer')+' · '+d+(x.note?' · '+x.note:'');amt=x.amount;col=''}
 else if(x.type==='bank_tx'){title=nameOf(db.banks,x.bank)||tr('Bank');sub=tr(x.dir==='deposit'?'Deposit':'Withdraw')+' · '+d;amt=x.amount;col=x.dir==='deposit'?'g':'r'}
 else if(x.type==='stock_adj'){title=nameOf(db.products,x.pid)||tr('Product');sub=tr(x.dir==='add'?'Stock added':'Stock reduced')+' · '+d;return '<div class="row" data-a="go" data-r="form" data-k="stock_adj" data-id="'+x.id+'"><div class="av">'+ic('product',22)+'</div><div class="rm"><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></div><div class="rr"><b class="'+(x.dir==='add'?'g':'r')+'">'+(x.dir==='add'?'+':'−')+fmt(x.qty)+'</b></div></div>'}
 return '<div class="row" data-a="go" data-r="form" data-k="'+kind+'" data-id="'+x.id+'"><div class="av">'+esc((title[0]||'').toUpperCase())+'</div><div class="rm"><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></div><div class="rr"><b class="'+col+'">'+cur(amt)+'</b></div></div>';
}

 if(k==='banks'){return '<div class="row" data-a="go" data-r="form" data-k="bank" data-id="'+x.id+'"><div class="av">'+ic('bank',22)+'</div><div class="rm"><b>'+esc(x.name)+'</b><small>'+esc(x.acc||'')+'</small></div><div class="rr"><b>'+cur(c.bank[x.id])+'</b></div></div>'}

}

 }).join('');

ACT.saveinv=()=>{
 const x=S.inv,I=INV[x.type];
 x.items=x.items.filter(i=>num(i.qty)>0);
 if(!x.items.length)return toast('Add at least one item with a quantity');
 x.total=totT();
 if(I.order){x.paid=0;if(!x.status)x.status='pending'}
 else{
  x.paid=num(x.paid);
  if(x.paid>x.total+0.004){x.paid=x.total;toast('Amount was more than the total, so it was set to the total')}
  if(x.total-x.paid>0.004&&!x.party)return toast('Choose a party to record the due amount');
 }
 if(!x.date)x.date=today();
 if(S.invEdit){const i=db.tx.findIndex(z=>z.id===S.invEdit);x.id=S.invEdit;x.ts=db.tx[i]?db.tx[i].ts:Date.now();if(i>=0)db.tx[i]=x;else db.tx.push(x)}
 else{x.id=uid();x.ts=Date.now();x.no=nextNo(x.type);db.tx.push(x)}
 if(S.invFrom){const o=db.tx.find(z=>z.id===S.invFrom);if(o)o.status='done'}
 saveDB();
 const id=x.id;S.inv=null;S.invEdit=null;S.invFrom=null;
 S.route='detail';S.p={id:id};toast('Saved');render();
};

 }
 if(r==='expense'){

 if(r==='stock'){

/* ---------- barcode ---------- */
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'};
function c39(text){
 const s='*'+String(text).toUpperCase().replace(/[^0-9A-Z\-\. ]/g,'-')+'*';
 let x=0,bars='';
 for(const ch of s){const pt=C39[ch];for(let i=0;i<9;i++){const w=pt[i]==='w'?5:2;if(i%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="50"/>';x+=w}x+=2}
 return '<svg class="bar" viewBox="0 0 '+(x-2)+' 50" preserveAspectRatio="none"><g fill="#000">'+bars+'</g></svg>';
}
function bcBody(){
 const b=S.bc,p=db.products.find(z=>z.id===b.pid);
 const code=p?(p.barcode||''):b.text.trim();
 if(!code)return '<p class="em">'+tr('Choose a product or type a code to see the labels.')+'</p>';
 const n=Math.max(1,Math.min(60,Math.floor(num(b.copies))||1));
 const one='<div class="bcl">'+(p?'<b>'+esc(p.name)+'</b>':'')+c39(code)+'<span>'+esc(code)+'</span>'+(p&&b.price?'<b>'+cur(p.sell)+'</b>':'')+'</div>';
 return '<div class="bcg">'+new Array(n+1).join(one)+'</div>';
}

const SYNC_DIR='bdc-pro';
const SY=()=>meta.sync||(S.rs?{repo:S.rs.repo,token:S.rs.token}:null);
const userPub=()=>{const u=meta.user;return{name:u.name,phone:u.phone,salt:u.salt,ph:u.ph,upd:num(u.upd)}};
const b64e=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)};
const b64d=b=>{const bin=atob(String(b).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
function cj(v){if(Array.isArray(v))return '['+v.map(cj).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+cj(v[k])).join(',')+'}';return JSON.stringify(v)}
const canon=d=>{const o={};COLLS.forEach(c=>{o[c]=(d[c]||[]).slice().sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0)});o.seq=d.seq||{};o.set=d.set||{};o.setUpd=num(d.setUpd);o.del=d.del||{};return cj(o)};
function mergeDB(a,b){
 const o={},del=Object.assign({},b.del||{});
 Object.keys(a.del||{}).forEach(k=>{del[k]=Math.max(num(del[k]),num(a.del[k]))});
 COLLS.forEach(c=>{
  const m={};
  (b[c]||[]).forEach(r=>{m[r.id]=r});
  (a[c]||[]).forEach(r=>{const x=m[r.id];if(!x||num(r.upd)>=num(x.upd))m[r.id]=r});
  o[c]=Object.keys(m).map(k=>m[k]).filter(r=>!(del[r.id]&&num(del[r.id])>=num(r.upd)));
 });
 o.seq=Object.assign({},b.seq||{});
 Object.keys(a.seq||{}).forEach(k=>{o.seq[k]=Math.max(num(o.seq[k]),num(a.seq[k]))});
 o.set=num(a.setUpd)>=num(b.setUpd)?a.set:b.set;
 o.setUpd=Math.max(num(a.setUpd),num(b.setUpd));
 o.del=del;
 return o;
}
function applyDB(m){db=m;db.set=Object.assign({cur:'Tk',low:5,note:DEFNOTE},db.set);db.del=db.del||{};rebuildCache();LS.set('bdcpro_db_'+meta.cur,db)}
function apiErr(r){const e=new Error('GitHub '+r.status);e.code=r.status===401?'auth':r.status===403?'perm':r.status===404?'notfound':(r.status===409||r.status===422)?'conflict':'api';return e}
async function gh(path,opt){
 opt=opt||{};
 const h={'Authorization':'Bearer '+SY().token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 if(opt.body)h['Content-Type']='application/json';
 const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',cache:'no-store',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
 let j=null;try{j=await r.json()}catch(e){}
 return{status:r.status,ok:r.ok,json:j};
}
const fileUrl=cid=>'/repos/'+SY().repo+'/contents/'+SYNC_DIR+'/'+encodeURIComponent(cid)+'.json';
async function readRemote(cid){
 const r=await gh(fileUrl(cid));
 if(r.status===404)return null;
 if(!r.ok)throw apiErr(r);
 let text;
 if(r.json.content&&r.json.encoding==='base64')text=b64d(r.json.content);
 else{const b=await gh('/repos/'+SY().repo+'/git/blobs/'+r.json.sha);if(!b.ok)throw apiErr(b);text=b64d(b.json.content)}
 return{sha:r.json.sha,data:JSON.parse(text)};
}
async function writeRemote(cid,data,sha){
 const body={message:'BDC PRO sync',content:b64e(JSON.stringify(data))};
 if(sha)body.sha=sha;
 const r=await gh(fileUrl(cid),{method:'PUT',body:body});
 if(!r.ok)throw apiErr(r);
}
function errText(e){
 if(e&&e.code==='auth')return tr('Token rejected by GitHub. It may be expired or wrong.');
 if(e&&e.code==='perm')return tr('The token cannot write to this repository. Give it Contents: Read and write.');
 if(e&&e.code==='notfound')return tr('Could not reach the repository. Check the name and that the token has access.');
 if(e instanceof TypeError)return tr('You are offline');
 return (e&&e.message)||'error';
}
const ft=ts=>{const d=new Date(ts);return fd(ymd(d))+' '+dg(pad(d.getHours())+':'+pad(d.getMinutes()))};
function syncText(){
 const s=S.sync,st=curStore();
 if(s.state==='busy')return tr('Syncing…');
 if(s.state==='err')return tr('Sync failed: {0}',s.msg);
 if(s.state==='offline')return tr('You are offline');
 return st&&st.syncedAt?tr('Synced'):tr('Never synced');
}
const lastText=()=>{const st=curStore();return st&&st.syncedAt?tr('Last synced: {0}',ft(st.syncedAt)):''};
function setSync(state,msg){
 S.sync={state:state,msg:msg||''};
 const b=$('#cloudBtn');if(b)b.dataset.s=state;
 const t=$('#syStat');if(t)t.textContent=syncText();
 const l=$('#syLast');if(l)l.textContent=lastText();
}
let syncing=false,again=false,syncT=null;
async function syncNow(manual){
 const st=meta.user&&meta.auth?curStore():null,c=meta.sync;
 if(!c||!st||!st.cid||!db)return;
 if(!navigator.onLine){setSync('offline');if(manual)toast('You are offline');return}
 if(syncing){again=true;return}
 syncing=true;setSync('busy');
 try{
  for(let attempt=0;attempt<3;attempt++){
   const rem=await readRemote(st.cid);
   const ru=rem&&rem.data&&rem.data.user;
   if(ru&&ru.ph&&num(ru.upd)>num(meta.user.upd)){meta.user.name=ru.name;meta.user.phone=ru.phone;meta.user.salt=ru.salt;meta.user.ph=ru.ph;meta.user.upd=ru.upd;saveMeta()}
   const merged=(rem&&rem.data&&rem.data.db)?mergeDB(db,rem.data.db):db;
   const changedLocal=merged!==db&&canon(merged)!==canon(db);
   if(changedLocal)applyDB(merged);
   const need=!rem||!rem.data||!rem.data.db||canon(db)!==canon(rem.data.db)||cj(ru||null)!==cj(userPub());
   if(need){
    try{await writeRemote(st.cid,{app:'bdcpro',v:2,store:st.name,cid:st.cid,updated:Date.now(),user:userPub(),db:db},rem&&rem.sha)}
    catch(e){if(e.code==='conflict'&&attempt<2)continue;throw e}
   }
   st.syncedAt=Date.now();saveMeta();setSync('ok');
   if(manual)toast('Synced');
   if(changedLocal&&['home','list','party','detail','due','reports','report','settings'].indexOf(S.route)>=0)render();
   break;
  }
 }catch(e){
  const m=errText(e);setSync('err',m);
  if(manual)toast(tr('Sync failed: {0}',m));
 }finally{
  syncing=false;
  if(again){again=false;schedSync(1500)}
 }
}
function schedSync(ms){
 if(!meta.sync||!meta.sync.auto||!meta.auth)return;
 const st=curStore();if(!st||!st.cid)return;
 clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),ms||4000);
}
const SYNC_STEPS_EN=['On GitHub create a new PRIVATE repository (for example bdc-data) and tick "Add a README".','Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.','Repository access: Only select repositories → choose that repository. Permissions → Repository permissions → Contents: Read and write.','Copy the token (starts with github_pat_) and paste it here together with the repository name, like yourname/bdc-data, then tap Connect.','Never use the public app repository for data, and never share the token. Give the token an expiry date.'];
function setupHelp(){
 return '<details class="faq"><summary>'+tr('How to set it up')+'</summary><ol>'+[1,2,3,4,5].map(i=>'<li>'+(LANG==='bn'?BN['sync step '+i]:SYNC_STEPS_EN[i-1])+'</li>').join('')+'</ol></details>';
}

 const c=meta.sync,st=curStore();
 let h='<div class="card mt"><b>'+tr('Cloud Sync (GitHub)')+'</b>';

   +'<div class="fg"><label>'+tr('Access token')+'</label><input class="inp" id="gTok" type="password" placeholder="github_pat_…" autocomplete="off"></div>'
   +'<button class="btn" data-a="gconnect">'+tr('Connect')+'</button>'+setupHelp();
 }else{

  if(!st.cid){
   h+='<p class="mut">'+tr('This store is not linked to the cloud yet.')+'</p><button class="btn" data-a="gupload">'+tr('Upload this store to the cloud')+'</button><button class="btn sec" data-a="glist">'+tr('Link to a store already in the cloud')+'</button>';
  }else{
   h+='<div class="sum"><span id="syStat">'+esc(syncText())+'</span><span id="syLast" style="font-weight:600;font-size:12.5px">'+esc(lastText())+'</span></div>'
    +'<button class="btn" data-a="gsync">'+tr('Sync now')+'</button>'
    +'<div class="fg mt"><label>'+tr('Auto sync')+'</label><select class="inp" id="gAuto"><option value="1"'+(c.auto?' selected':'')+'>'+tr('On')+'</option><option value="0"'+(c.auto?'':' selected')+'>'+tr('Off')+'</option></select></div>'
    +'<button class="btn sec" data-a="gunlink">'+tr('Unlink this store')+'</button>';
  }
  h+='<button class="btn sec" style="color:var(--red);border-color:var(--red)" data-a="gdisc">'+tr('Disconnect GitHub')+'</button>';
 }
 return h+'<p class="mut" style="margin-bottom:0">'+tr('The token is saved on this device only. Use a token limited to this one repository, with an expiry date.')+'</p></div>';
}
ACT.gconnect=async()=>{
 let repo=($('#gRepo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
 const tok=($('#gTok').value||'').trim();
 if(!repo||!tok)return toast('Enter the repository and token');
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Repository name must look like owner/name');
 toast('Loading…');
 const prev=meta.sync;meta.sync={repo:repo,token:tok,auto:true};
 try{
  const r=await gh('/repos/'+repo);
  if(r.status===401)throw apiErr(r);
  if(!r.ok)throw Object.assign(new Error('nf'),{code:'notfound'});
  if(!r.json.private){meta.sync=prev||null;return toast('This repository is public. Anyone could read your shop data. Use a private repository.')}
  saveMeta();render();toast('Connected');
 }catch(e){meta.sync=prev||null;toast(errText(e))}
};
ACT.gsync=()=>syncNow(true);
ACT.cloud=()=>syncNow(true);
ACT.gupload=()=>{const st=curStore();st.cid=uid();saveMeta();syncNow(true).then(()=>{render();if(S.sync.state==='ok')toast('Uploaded to the cloud')})};
ACT.glist=async()=>{
 sheet('<h3>'+tr('Stores in the cloud')+'</h3><p class="em">'+tr('Loading…')+'</p>');
 try{
  const r=await gh('/repos/'+SY().repo+'/contents/'+SYNC_DIR);
  let files=[];
  if(r.status!==404){if(!r.ok)throw apiErr(r);files=(r.json||[]).filter(f=>/\.json$/.test(f.name))}
  const items=[];
  for(const f of files){
   const cid=f.name.replace(/\.json$/,'');
   try{const x=await readRemote(cid);if(x&&x.data)items.push({cid:cid,name:x.data.store||cid,upd:x.data.updated||0,n:((x.data.db||{}).tx||[]).length})}catch(e){}
  }
  sheet('<h3>'+tr('Stores in the cloud')+'</h3>'+(items.length?'<p class="mut">'+tr('Linking merges the cloud data with this store’s data.')+'</p>'+items.map(i=>'<div class="row" data-a="glink" data-c="'+esc(i.cid)+'" data-n="'+esc(i.name)+'"><div class="av">'+esc((i.name[0]||'S').toUpperCase())+'</div><div class="rm"><b>'+esc(i.name)+'</b><small>'+tr('Updated {0}',ft(i.upd))+' · '+tr('{0} records',fmt(i.n))+'</small></div>'+ic('right',20,'#8a89a0')+'</div>').join(''):'<p class="em">'+tr('Nothing has been uploaded to this repository yet.')+'</p>')+'<button class="btn sec mt" data-a="closesheet">'+tr('Cancel')+'</button>');
 }catch(e){closeSheet();toast(tr('Sync failed: {0}',errText(e)))}
};
ACT.glink=d=>ask(tr('Merge the cloud store “{0}” into this store?',d.n),()=>{const st=curStore();st.cid=d.c;saveMeta();syncNow(true).then(()=>{render();if(S.sync.state==='ok')toast('Linked and synced')})},'Link');
ACT.gunlink=()=>ask('Unlink this store? The cloud copy stays.',()=>{const st=curStore();delete st.cid;delete st.syncedAt;saveMeta();setSync('idle');render()},'Unlink');
ACT.gdisc=()=>ask('Disconnect from GitHub? Your data on this phone stays.',()=>{meta.sync=null;saveMeta();setSync('idle');render();toast('Disconnected')},'Disconnect');

/* ---------- restore an account on a new device from GitHub ---------- */
function viewRestore(){
 const r=S.rs;
 let h='<div class="au">'+langBtn()+authTop(tr('Restore from GitHub'))+'<div class="card">';
 if(r.step===1){
  h+='<h3>'+tr('Restore from GitHub')+'</h3><p class="mut" style="margin-top:0">'+tr('Keep your data on several phones and safe in your own private GitHub repository.')+'</p>'
   +'<div class="fg"><label>'+tr('Repository (owner/name)')+'</label><input class="inp" id="rsRepo" placeholder="yourname/bdc-data" autocapitalize="none" autocomplete="off" spellcheck="false" value="'+esc(r.repo)+'"></div>'
   +'<div class="fg"><label>'+tr('Access token')+'</label><input class="inp" id="rsTok" type="password" placeholder="github_pat_…" autocomplete="off"></div>'
   +'<button class="btn" data-a="rsfind">'+tr('Find my stores')+'</button>';
 }else if(r.step===2){
  h+='<h3>'+tr('Choose your store')+'</h3>'+(r.items.length?r.items.map(i=>'<div class="row" data-a="rspick" data-c="'+esc(i.cid)+'"><div class="av">'+esc((i.name[0]||'S').toUpperCase())+'</div><div class="rm"><b>'+esc(i.name)+'</b><small>'+tr('Updated {0}',ft(i.upd))+'</small></div>'+ic('right',20,'#8a89a0')+'</div>').join(''):'<p class="em">'+tr('No stores found in this repository.')+'</p>');
 }else{
  h+='<h3>'+tr('Enter the password of {0}',esc(r.pick.data.user.name))+'</h3><div class="fg"><label>'+tr('Password')+'</label><input class="inp" id="rPass" type="password" autocomplete="current-password"></div><button class="btn" data-a="rslogin">'+tr('Login')+'</button>';
 }
 return h+'<button class="btn sec" style="margin-top:12px" data-a="rsclose">'+tr('Back')+'</button></div></div>';
}
ACT.rsopen=()=>{S.rs={step:1,repo:'',token:'',items:[],pick:null};render()};
ACT.rsclose=()=>{S.rs=null;render()};
ACT.rsfind=async()=>{
 const repo=($('#rsRepo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
 const tok=($('#rsTok').value||'').trim();
 if(!repo||!tok)return toast('Enter the repository and token');
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Repository name must look like owner/name');
 S.rs.repo=repo;S.rs.token=tok;toast('Loading…');
 try{
  const r0=await gh('/repos/'+repo);
  if(r0.status===401)throw apiErr(r0);
  if(!r0.ok)throw Object.assign(new Error('nf'),{code:'notfound'});
  if(!r0.json.private)return toast('This repository is public. Anyone could read your shop data. Use a private repository.');
  const r=await gh('/repos/'+repo+'/contents/'+SYNC_DIR);
  let files=[];
  if(r.status!==404){if(!r.ok)throw apiErr(r);files=(r.json||[]).filter(f=>/\.json$/.test(f.name))}
  const items=[];
  for(const f of files){
   const cid=f.name.replace(/\.json$/,'');
   try{const x=await readRemote(cid);if(x&&x.data&&x.data.db)items.push({cid:cid,name:x.data.store||cid,upd:x.data.updated||0,data:x.data})}catch(e){}
  }
  S.rs.items=items;S.rs.step=2;render();
 }catch(e){toast(errText(e))}
};
ACT.rspick=d=>{
 const it=S.rs.items.find(z=>z.cid===d.c);if(!it)return;
 if(!it.data.user||!it.data.user.ph){
  sheet('<h3>'+tr('Restore from GitHub')+'</h3><p>'+tr('This cloud copy was saved by an older version. On your first device update the app, open it once and let it sync, then try again.')+'</p><button class="btn" data-a="closesheet">'+tr('Cancel')+'</button>');
  return;
 }
 S.rs.pick=it;S.rs.step=3;render();
};
ACT.rslogin=()=>{
 const u=S.rs.pick.data.user;
 if(hashPw($('#rPass').value,u.salt)!==u.ph)return toast('Wrong password');
 const id=uid(),p=S.rs.pick;
 meta.user={name:u.name,phone:u.phone,salt:u.salt,ph:u.ph,upd:num(u.upd),avatar:''};
 meta.stores=[{id:id,name:p.name,cid:p.cid,syncedAt:Date.now()}];meta.cur=id;
 meta.sync={repo:S.rs.repo,token:S.rs.token,auto:true};meta.auth=true;meta.lock='stay';meta.lockv=2;
 saveMeta();
 LS.set('bdcpro_db_'+id,p.data.db);
 db=null;S.rs=null;S.route='home';S.stack=[];render();
 toast('Connected');
};

/* ---------- global events ---------- */
$('#shell').addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const f=ACT[el.dataset.a];
 if(f){e.preventDefault();f(el.dataset,el)}
});
document.addEventListener('input',e=>{
 const t=e.target,id=t.id;
 if(id==='q'){S.q=t.value;if(S.refresh)S.refresh();return}
 if(id==='pq'){S.pq=t.value;$('#pl').innerHTML=pickHTML();return}
 if(id==='pq2'){S.pq=t.value;$('#pList').innerHTML=prodCards();syncBadges();return}
 if(t.dataset&&t.dataset.li!==undefined&&S.inv){S.inv.items[+t.dataset.li][t.dataset.f]=num(t.value);refreshTot();return}
 if(S.route==='barcode'&&(id==='bcT'||id==='bcN')){if(id==='bcT')S.bc.text=t.value;else S.bc.copies=t.value;$('#bcO').innerHTML=bcBody();return}
 if(S.route==='message'&&id==='mT'){msgLinks();return}
 if(!S.inv||S.route!=='inv')return;
 if(id==='iDisc'){S.inv.disc=num(t.value);refreshTot()}
 else if(id==='iPaid'){S.inv.paid=num(t.value);S.paidTouched=true;refreshTot()}
 else if(id==='iNote')S.inv.note=t.value;
});
document.addEventListener('change',e=>{
 const t=e.target,id=t.id;
 if(id==='avIn'){
  const file=t.files&&t.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
   const s=160,c=document.createElement('canvas');c.width=c.height=s;
   const m=Math.min(im.width,im.height),cx=c.getContext('2d');
   cx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
   meta.user.avatar=c.toDataURL('image/jpeg',.85);saveMeta();renderDrawer();toast('Profile photo updated');
  };im.src=rd.result};
  rd.readAsDataURL(file);t.value='';return;
 }
 if(S.route==='inv'&&S.inv){
  if(id==='iDate')S.inv.date=t.value;
  else if(id==='iParty')S.inv.party=t.value;
  else if(id==='iMode')S.inv.mode=t.value;
 }
 if(S.route==='report'&&(id==='rf'||id==='rt')){S.rp='custom';S.rf=$('#rf').value;S.rt=$('#rt').value;render()}
 if(S.route==='report'&&id==='bsd'){S.bsd=t.value||today();if(S.refresh)S.refresh()}
 if(S.route==='barcode'){
  if(id==='bcP'){S.bc.pid=t.value}else if(id==='bcT'){S.bc.text=t.value}else if(id==='bcN'){S.bc.copies=t.value}else if(id==='bcS'){S.bc.price=t.value==='1'}else return;
  $('#bcO').innerHTML=bcBody();
 }
 if(S.route==='message'&&(id==='mP'||id==='mT'))msgLinks();
 if(id==='gAuto'&&meta.sync){meta.sync.auto=t.value==='1';saveMeta();if(meta.sync.auto)schedSync(500)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!meta.auth&&meta.user&&e.target.id==='lPass')ACT.login();
 if(e.key==='Enter'&&e.target.id==='pq2'){e.preventDefault();addByCode()}
 if(e.key==='Enter'&&e.target.id==='rPass')ACT.rslogin();
});

/* Install icon: if manifest.json or its icons are missing on the host (e.g. only index.html was uploaded),
   build a manifest on the fly with the icons embedded in this file. */
(function(){
 if(!/^https?:$/.test(location.protocol))return;
 const build=()=>{
  const base=location.href.split('#')[0].split('?')[0];
  const m={name:'BDC PRO',short_name:'BDC PRO',start_url:base,scope:base.replace(/[^\/]*$/,''),display:'standalone',background_color:'#ffffff',theme_color:'#7561ff',
   icons:[{src:ICON192,sizes:'192x192',type:'image/png',purpose:'any'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
  const u=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  document.querySelectorAll('link[rel="manifest"]').forEach(e=>e.remove());
  const l=document.createElement('link');l.rel='manifest';l.href=u;document.head.appendChild(l);
 };
 fetch('manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return fetch('icons/icon-192.png',{cache:'no-store'})}).then(r=>{if(!r.ok)throw 0}).catch(build);
})();
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=Date.now();return}
 if(meta.auth&&meta.lock==='ask'&&hiddenAt&&Date.now()-hiddenAt>5*60*1000){meta.auth=false;saveMeta();closeSheet();closeDrawer();S.route='home';S.stack=[];render();return}
 schedSync(600);
});
window.addEventListener('online',()=>schedSync(600));
setInterval(()=>{if(!document.hidden)schedSync(100)},90000);
document.documentElement.lang=LANG;
applyTheme();
render();
if(meta.auth)schedSync(1500);
setTimeout(()=>{const s=$('#splash');if(!s)return;s.style.opacity='0';setTimeout(()=>s.remove(),500)},900);
})();
